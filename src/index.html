<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rep52 <small>by ######</small></h1>
    <div id="container">
        <div>
            <label for="spades">&spades;</label>
            <input id="spades" type="text" value="Push-ups" placeholder="Push-ups">
        </div>
        <div>
            <label for="clubs">&clubs;</label>
            <input id="clubs" type="text" value="Lunges" placeholder="Lunges">
        </div>
        <div>
            <label for="hearts">&hearts;</label>
            <input id="hearts" type="text" value="Squats" placeholder="Squats">
        </div>
        <div>
            <label for="diamonds">&diamondsuit;</label>
            <input id="diamonds" type="text" value="Jumping Jacks" placeholder="Jumping Jacks">
        </div>

        <div>
            <label for="ace">Ace:</label>
            <input id="ace" type="number" value="1" placeholder="1">
        </div>
        <div>
            <label for="face-cards">Face cards:</label>
            <input id="face-cards" type="number" value="10" placeholder="10">
        </div>

        <div id="test">
            <button>DRAW</button>
            <p>7 &hearts;</p>
            <p>7 SQUATS</p>
            <p>51 cards left</p>
        </div>
    </div>

    <!-- d -->


</body>
</html>
