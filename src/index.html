<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Rep52 <small>by ######</small></h1>
    <div id="container">
        <div>
            <label for="spades">&spades;</label>
            <input id="spades-input" type="text" value="Burpees" placeholder="Burpees">
        </div>
        <div>
            <label for="clubs">&clubs;</label>
            <input id="clubs-input" type="text" value="Mountain climbers" placeholder="Mountain climbers">
        </div>
        <div>
            <label for="hearts">&hearts;</label>
            <input id="hearts-input" type="text" value="Push-ups" placeholder="Push-ups">
        </div>
        <div>
            <label for="diamonds">&diamondsuit;</label>
            <input id="diamonds-input" type="text" value="Bodyweight squats" placeholder="Bodyweight squats">
        </div>

        <div>
            <label for="ace">Ace:</label>
            <input id="ace" type="number" value="1" placeholder="1">
        </div>
        <div>
            <label for="face-cards">Face cards:</label>
            <input id="face-cards" type="number" value="11" placeholder="11">
        </div>

        <button id="draw-button">DRAW</button>
        <p id="card-display"># #</p>
        <p id="exercise-display"># ######</p>
        <p id="cards-left">52 cards left</p>
    </div>

    <!-- d -->


</body>
</html>
